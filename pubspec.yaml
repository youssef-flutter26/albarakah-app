name: alberaperfume
description: Premium fragrance ecommerce app for India, Middle East and Asia-Pacific.
publish_to: "none"
version: 9.0.0+10

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.0
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  flutter_bloc: ^9.1.1
  dio: ^5.11.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  integration_test:
    sdk: flutter
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appicon1.jpg"
  min_sdk_android: 21